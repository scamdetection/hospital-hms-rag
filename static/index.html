<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital HMS RAG</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7fb;color:#1f2937}
.container{max-width:900px;margin:50px auto;padding:20px}
.card{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
textarea{width:100%;height:110px;padding:12px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:8px;font-size:16px}
button{margin-top:12px;padding:12px 22px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#answer{margin-top:25px;white-space:pre-wrap;line-height:1.6}
.source{margin-top:8px;padding:10px;background:#f8fafc;border-left:3px solid #2563eb}
</style>
</head>
<body>
<div class="container"><div class="card">
<h1>Hospital Management System RAG</h1>
<p>Ask questions from the HMS KT document.</p>
<textarea id="question" placeholder="Example: Explain the appointment workflow."></textarea>
<br><button id="btn" onclick="ask()">Ask Question</button>
<div id="answer"></div>
<div id="sources"></div>
</div></div>
<script>
async function ask(){
  const q=document.getElementById("question").value.trim();
  if(!q)return;
  const btn=document.getElementById("btn");
  btn.disabled=true; btn.textContent="Searching...";
  document.getElementById("answer").textContent="";
  document.getElementById("sources").innerHTML="";
  try{
    const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,top_k:4})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail || "Request failed");
    document.getElementById("answer").textContent=data.answer;
    document.getElementById("sources").innerHTML="<h3>Retrieved sections</h3>"+
      data.sources.map(s=>`<div class="source"><b>${s.section}</b> — similarity ${s.similarity}</div>`).join("");
  }catch(e){
    document.getElementById("answer").textContent="Error: "+e.message;
  }finally{
    btn.disabled=false; btn.textContent="Ask Question";
  }
}
</script>
</body>
</html>
